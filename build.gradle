plugins {
    id 'java'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish' version '0.35.0'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
    id 'org.cyclonedx.bom' version '3.2.4'
}

group = 'dev.qilletni.pkgutil'
version = pkgutilVersion

repositories {
    mavenCentral()

    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

// Locks the resolved dependency graph for the configurations used to build
// and publish the release artifact, so a published version is always built
// from an exact, checked-in set of resolved coordinates (gradle.lockfile).
// Regenerate with `./gradlew dependencies --write-locks` after a dependency
// change.
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'com.google.code.gson:gson:2.10.1'
}

mavenPublishing {
    coordinates(group, "qilletni-pkgutil", version)

    pom {
        name = "Qilletni Package Util"
        description = "Shared utilities for interacting with Qilletni Packages"
        inceptionYear = "2025"
        url = "https://github.com/Qilletni/QilletniPackageUtility/"
        licenses {
            license {
                name = "MIT"
                url = "https://mit-license.org/"
                distribution = "https://mit-license.org/"
            }
        }
        developers {
            developer {
                id = "RubbaBoy"
                name = "Adam Yarris"
                url = "https://github.com/RubbaBoy/"
            }
        }
        scm {
            url = "https://github.com/Qilletni/QilletniPackageUtility"
            connection = "scm:git:git://github.com/Qilletni/QilletniPackageUtility.git"
            developerConnection = "scm:git:ssh://git@github.com/Qilletni/QilletniPackageUtility.git"
        }
    }
}

test {
    useJUnitPlatform()
}

// CycloneDX JSON SBOM, attached as a release asset by the publish workflow.
// Output: build/reports/cyclonedx-direct/qilletni-pkgutil-bom.json
//
// Named per component rather than the plugin's default `bom.json`, since a
// GitHub release asset is named after its file.
cyclonedxDirectBom {
    includeConfigs = ['runtimeClasspath']
    jsonOutput = layout.buildDirectory.file('reports/cyclonedx-direct/qilletni-pkgutil-bom.json')
}

// Public API compatibility check for `dev.qilletni.pkgutil:qilletni-pkgutil`, enforced against
// the policy in `tools/release/src/japicmp_policy.ts` (see `.qilletni/release.yml`, in
// `Qilletni/Qilletni`). `-PjapicmpBaselineJar=/path/to/old-qilletni-pkgutil.jar` points at the
// previously published baseline jar (downloaded and hash-verified beforehand by the publish
// workflow); the task is skipped if it is not supplied (e.g. for the first release). A local
// file path is used (rather than a Maven coordinate) to avoid Gradle resolving the dependency
// back to this very project.
import me.champeau.gradle.japicmp.JapicmpTask

def japicmpBaselineJar = findProperty('japicmpBaselineJar')

tasks.register('japicmpCheck', JapicmpTask) {
    description = 'Compares the current public API against the published baseline jar'
    onlyIf { japicmpBaselineJar != null }
    if (japicmpBaselineJar != null) {
        oldClasspath.from(files(japicmpBaselineJar))
    }
    newClasspath.from(tasks.named('jar').map { it.outputs.files })
    dependsOn tasks.named('jar')
    accessModifier = 'public'
    onlyBinaryIncompatibleModified = false
    failOnModification = false
    ignoreMissingClasses = true
    xmlOutputFile = file("${buildDir}/reports/japicmp/qilletni-pkgutil.xml")
}

// Guards a stable release publication from ever resolving a SNAPSHOT or
// dynamic-version dependency, run by release.yml before publishing a tag.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

tasks.register('checkNoSnapshotDependencies') {
    description = 'Fails if the resolved runtime/compile classpath contains a SNAPSHOT or dynamic external dependency version'
    doLast {
        def offenders = []
        ['runtimeClasspath', 'compileClasspath'].each { configName ->
            configurations.getByName(configName).incoming.resolutionResult.allComponents.each { component ->
                def id = component.id
                if (id instanceof ModuleComponentIdentifier) {
                    def version = id.version
                    if (version.contains('SNAPSHOT') || version.contains('+') || version.startsWith('latest.')) {
                        offenders << "${configName}: ${id.group}:${id.module}:${version}".toString()
                    }
                }
            }
        }
        if (offenders) {
            throw new GradleException("A stable release must not resolve SNAPSHOT/dynamic dependencies:\n" + offenders.join('\n'))
        }
    }
}
